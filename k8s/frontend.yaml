apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywatch-frontend
  namespace: skywatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywatch-frontend
  template:
    metadata:
      labels:
        app: skywatch-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/eladp100/skywatch-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: skywatch-frontend
  namespace: skywatch
spec:
  selector:
    app: skywatch-frontend
  ports:
    - port: 5000
      targetPort: 5000
