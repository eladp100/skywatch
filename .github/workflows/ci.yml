name: SkyWatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/frontend/requirements.txt

      - name: Run frontend tests
        run: |
          python -m pytest app/frontend/test_app.py -v

  test-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check worker Python syntax
        run: python -m py_compile app/worker/worker.py
  
  build-docker:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t skywatch-frontend:ci ./app/frontend

      - name: Build worker Docker image
        run: docker build -t skywatch-worker:ci ./app/worker
