name: SkyWatch CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/frontend/requirements.txt

      - name: Run frontend tests
        run: |
          python -m pytest app/frontend/test_app.py -v

  test-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check worker Python syntax
        run: python -m py_compile app/worker/worker.py

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend Docker image
        run: docker build -t ghcr.io/eladp100/skywatch-frontend:latest ./app/frontend

      - name: Build worker Docker image
        run: docker build -t ghcr.io/eladp100/skywatch-worker:latest ./app/worker

      - name: Push frontend Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/eladp100/skywatch-frontend:latest

      - name: Push worker Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/eladp100/skywatch-worker:latest
