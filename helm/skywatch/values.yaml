frontend:
  replicaCount: 1
  image: ghcr.io/eladp100/skywatch-frontend:latest
  port: 5000
  nodeSelector:
    kubernetes.io/hostname: ip-172-31-34-253
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

worker:
  replicaCount: 1
  image: ghcr.io/eladp100/skywatch-worker:latest
  nodeSelector:
    kubernetes.io/hostname: ip-172-31-4-251
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

rabbitmq:
  replicaCount: 1
  image: rabbitmq:4-management-alpine
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

existingSecret: rabbitmq-credentials
