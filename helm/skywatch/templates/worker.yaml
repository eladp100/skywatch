apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywatch-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: skywatch-worker
  template:
    metadata:
      labels:
        app: skywatch-worker
    spec:
      nodeSelector:
{{ toYaml .Values.worker.nodeSelector | indent 8 }}
      containers:
        - name: worker
          image: {{ .Values.worker.image | quote }}
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: password
          resources:
{{ toYaml .Values.worker.resources | indent 12 }}
